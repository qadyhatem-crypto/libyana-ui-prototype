<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Libyana mobile application redesign prototype for UX testing.">
  <title>Libyana UI Prototype</title>
  <style>
    :root{--ink:#091c33;--navy:#0b2d50;--navy2:#123f69;--green:#a8ff3e;--green-dark:#5c9d12;--mist:#eef4f7;--line:#dbe6ec;--muted:#698093;--white:#fff}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#07192b;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}
    .shell{min-height:100vh;display:grid;grid-template-columns:minmax(320px,520px) minmax(430px,1fr);align-items:center;gap:clamp(48px,8vw,128px);padding:48px clamp(32px,6vw,96px);overflow:hidden;background:radial-gradient(circle at 9% 15%,rgba(168,255,62,.15),transparent 28%),radial-gradient(circle at 84% 84%,rgba(73,178,255,.15),transparent 27%),linear-gradient(140deg,#07182a 0%,#0b2d50 58%,#07182a 100%)}
    .project{color:#fff;max-width:500px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px}.project h1{font-size:clamp(48px,6vw,76px);line-height:.96;letter-spacing:-.055em;margin:0;max-width:470px}.project>p{color:#c3d2dd;font-size:17px;line-height:1.7;max-width:470px;margin:26px 0 32px}.tasks{border-top:1px solid rgba(255,255,255,.15)}.tasks>div{display:grid;grid-template-columns:42px 1fr;align-items:center;min-height:52px;border-bottom:1px solid rgba(255,255,255,.15)}.tasks span{color:var(--green);font-size:12px;font-weight:800}.tasks p{margin:0;font-size:14px;font-weight:650}.progress-card{margin-top:26px;padding:18px 20px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(255,255,255,.07);backdrop-filter:blur(14px)}.progress-card>div:first-child{display:flex;justify-content:space-between;gap:20px}.progress-card span{color:#aebfcb;font-size:12px}.progress-card strong{font-size:12px}.track{height:5px;background:rgba(255,255,255,.13);border-radius:8px;margin-top:13px;overflow:hidden}.track i{display:block;height:100%;background:var(--green);transition:width .35s ease}
    .stage{display:grid;place-items:center}.phone{position:relative;width:390px;height:820px;border:9px solid #061423;border-radius:48px;background:#f7fafb;box-shadow:0 34px 90px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.15);overflow:hidden}.phone:before{content:"";position:absolute;z-index:10;top:10px;left:50%;width:92px;height:24px;transform:translateX(-50%);border-radius:20px;background:#061423}.status{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:800}.status>span:last-child{letter-spacing:2px}.canvas{height:calc(100% - 112px);overflow:hidden;background:#f7fafb}.screen{height:100%;padding:0 20px 18px;overflow-y:auto;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
    .home-head{display:flex;align-items:center;justify-content:space-between;padding:8px 0 18px}.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:850;letter-spacing:-.03em;color:var(--navy)}.logo{width:31px;height:31px;display:grid;place-items:center;border-radius:10px 10px 10px 3px;background:var(--green);font-size:18px;font-weight:950}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:800}.welcome{margin:0 0 12px;color:var(--muted);font-size:13px;font-weight:600}.balance{position:relative;overflow:hidden;padding:21px;border-radius:24px;background:linear-gradient(145deg,#0c345c,#071f39);color:#fff;box-shadow:0 14px 26px rgba(11,45,80,.2)}.balance:after{content:"";position:absolute;width:170px;height:170px;border:24px solid rgba(168,255,62,.08);border-radius:50%;right:-70px;top:-76px}.balance-top{display:flex;justify-content:space-between;color:#c2d0da;font-size:12px;font-weight:650}.balance>strong{display:block;margin:12px 0 17px;font-size:34px;letter-spacing:-.04em}.balance>strong small{font-size:13px;color:var(--green)}.balance-meta{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center}.balance-meta span{font-size:10px;color:#afc0cc}.pill{border:0;border-radius:999px;background:var(--green);color:var(--navy);padding:8px 13px;font-size:11px;font-weight:850;cursor:pointer}
    .usage{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 21px}.usage article{padding:13px;border:1px solid var(--line);border-radius:17px;background:#fff}.usage-icon{float:left;width:31px;height:31px;display:grid;place-items:center;margin-right:9px;border-radius:10px;color:var(--green-dark);background:#efffdc;font-weight:900}.usage-icon.blue{color:#087ba2;background:#e5f8ff}.usage strong,.usage span{display:block}.usage strong{font-size:13px;line-height:1.2}.usage article>div span{color:var(--muted);font-size:9px;margin-top:3px}.mini{clear:both;height:4px;border-radius:5px;background:#edf2f4;margin-top:13px;overflow:hidden}.mini i{display:block;height:100%;background:var(--green-dark)}.mini.blue i{background:#1aa8d8}.heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}.heading h2{margin:0;font-size:17px}.heading span{color:var(--muted);font-size:10px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.service{min-height:111px;padding:12px 8px 10px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);cursor:pointer;transition:.16s}.service:hover{transform:translateY(-2px);border-color:#9fcab8}.service-icon{width:43px;height:43px;display:grid;place-items:center;margin:0 auto 8px;border-radius:14px;background:#eef5f8;color:var(--navy);font-size:23px;font-weight:800}.service:first-child .service-icon{background:#efffdc;color:var(--green-dark)}.service>span:nth-child(2){display:block;font-size:11px;font-weight:750;line-height:1.3}.service small{display:block;margin-top:4px;color:var(--green-dark);font-size:8px;font-weight:800}.offer{width:100%;display:grid;grid-template-columns:38px 1fr 20px;align-items:center;gap:10px;margin-top:13px;padding:12px;border:0;border-radius:17px;text-align:left;background:#e9f1f5;color:var(--ink);cursor:pointer}.offer-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--green);font-size:18px}.offer small,.offer strong{display:block}.offer small{color:var(--muted);font-size:9px;margin-bottom:3px}.offer strong{font-size:11px}
    .subhead{height:58px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:0 20px}.subhead h2{margin:0;text-align:center;font-size:17px}.back{width:36px;height:36px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:20px;cursor:pointer}.subhead+.screen{height:calc(100% - 58px)}.flow{display:flex;flex-direction:column}.intro{margin:2px 0 18px;color:var(--muted);font-size:13px;line-height:1.55}.package-list{display:grid;gap:10px}.package{position:relative;min-height:96px;display:grid;grid-template-columns:8px 1fr auto;grid-template-rows:1fr 1fr;align-items:center;column-gap:13px;padding:15px 42px 15px 15px;border:1.5px solid var(--line);border-radius:20px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;overflow:hidden}.package.selected{border-color:var(--navy);box-shadow:0 0 0 2px rgba(11,45,80,.08)}.accent{grid-row:1/3;align-self:stretch;width:6px;border-radius:8px}.package-info{grid-row:1/3}.package-info strong,.package-info small{display:block}.package-info strong{font-size:13px}.package-info small{color:var(--muted);font-size:10px;margin-top:5px}.package-data{align-self:end;text-align:right;color:var(--navy);font-size:11px;font-weight:850}.price{align-self:start;text-align:right}.price strong{font-size:17px}.price small{font-size:9px;color:var(--muted)}.radio{position:absolute;right:15px;top:50%;width:17px;height:17px;transform:translateY(-50%);border:1.5px solid #aabac5;border-radius:50%}.selected .radio{border-color:var(--navy)}.selected .radio:after{content:"";display:block;width:9px;height:9px;margin:2.5px;border-radius:50%;background:var(--green)}.popular{position:absolute;right:42px;top:7px;padding:3px 7px;border-radius:99px;background:var(--green);font-size:7px;font-weight:900;text-transform:uppercase}.secure{display:flex;align-items:center;justify-content:center;gap:7px;margin:15px 0;color:var(--muted);font-size:10px}.action{width:100%;min-height:49px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:15px;background:var(--navy);color:#fff;font-size:13px;font-weight:800;box-shadow:0 8px 18px rgba(11,45,80,.18);cursor:pointer}.action:hover{background:var(--navy2)}.action:disabled{opacity:.45;cursor:not-allowed}.bottom-push{margin-top:auto}.label{display:block;margin-bottom:8px;font-size:11px;font-weight:800}.input{width:100%;height:51px;border:1.5px solid var(--line);border-radius:15px;background:#fff;padding:0 14px;font-size:15px;font-weight:700;outline:0}.input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,45,80,.08)}.help{display:block;margin:6px 0 18px;color:var(--muted);font-size:9px}.amount-label{margin-top:20px}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.amounts button{height:63px;border:1.5px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.amounts button.selected{border-color:var(--navy);background:#eef4f7;box-shadow:inset 0 -4px 0 var(--green)}.amounts strong,.amounts span{display:block}.amounts strong{font-size:16px}.amounts span{color:var(--muted);font-size:8px;margin-top:2px}.info{display:flex;align-items:center;gap:11px;margin-top:20px;padding:14px;border-radius:16px;background:#e9f1f5;color:var(--navy)}.info>b{font-size:20px}.info strong,.info small{display:block}.info strong{font-size:11px}.info small{color:var(--muted);font-size:9px;margin-top:3px}.available{display:flex;justify-content:space-between;margin-top:18px;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fff}.available span{color:var(--muted);font-size:10px}.available strong{font-size:11px}
    .hero{min-height:142px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:4px;border-radius:23px;background:linear-gradient(145deg,#0d365f,#092440);color:#fff}.hero>span{width:43px;height:43px;display:grid;place-items:center;margin-bottom:10px;border-radius:14px;background:var(--green);color:var(--navy);font-size:21px}.hero small{color:#b7c8d3;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.hero strong{margin-top:5px;font-size:23px}.review{margin-top:14px;padding:3px 16px;border:1px solid var(--line);border-radius:18px;background:#fff}.review>div{display:flex;align-items:center;justify-content:space-between;min-height:43px;border-bottom:1px solid #edf1f3}.review>div:last-child{border-bottom:0}.review span{color:var(--muted);font-size:10px}.review strong{font-size:11px}.review .total{min-height:50px}.review .total span{color:var(--ink);font-weight:800}.review .total strong{font-size:15px;color:var(--navy)}
    .success{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px}.orbit{position:relative;width:130px;height:130px;display:grid;place-items:center;margin-bottom:29px;border:1px solid #d3e8b7;border-radius:50%}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #e5efd7;border-radius:50%}.orbit:before{width:96px;height:96px}.orbit:after{width:162px;height:162px}.orbit span{position:relative;z-index:1;width:70px;height:70px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:var(--navy);font-size:33px;font-weight:800;box-shadow:0 13px 30px rgba(92,157,18,.24)}.success-copy>span{color:var(--green-dark);font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.success-copy h2{margin:8px 0;font-size:24px}.success-copy p{max-width:275px;margin:0;color:var(--muted);font-size:12px;line-height:1.55}.success-detail{width:100%;margin:23px 0 20px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff}.success-detail span,.success-detail small{display:block}.success-detail span{font-size:12px;font-weight:800}.success-detail small{margin-top:5px;color:var(--muted);font-size:9px}.success-note{margin:13px 0 0;color:var(--muted);font-size:9px}.nav{height:70px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;border-top:1px solid var(--line);background:#fff}.nav button{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:#8a9ba7;cursor:pointer}.nav button.active{color:var(--navy)}.nav b{font-size:18px}.nav span{font-size:9px;font-weight:700}
    @media(max-width:860px){body{background:#f7fafb}.shell{display:block;min-height:100vh;padding:0;background:#f7fafb}.project{display:none}.phone{width:100%;height:100vh;min-height:690px;border:0;border-radius:0;box-shadow:none}}
    @media(max-height:850px) and (min-width:861px){.shell{padding-top:20px;padding-bottom:20px}.phone{transform:scale(.92)}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="project" aria-label="Prototype information">
      <div class="eyebrow">UX/UI assignment prototype</div>
      <h1>Libyana, made simpler.</h1>
      <p>A focused mobile concept for buying a package, recharging credit and transferring balance with clear confirmations.</p>
      <div class="tasks"><div><span>01</span><p>Buy an internet package</p></div><div><span>02</span><p>Recharge 10 LYD</p></div><div><span>03</span><p>Transfer 5 LYD</p></div></div>
      <div class="progress-card"><div><span>Testing progress</span><strong id="progress-label">0/3 flows completed</strong></div><div class="track"><i id="progress-bar" style="width:0"></i></div></div>
    </section>
    <section class="stage" aria-label="Interactive Libyana mobile prototype">
      <div class="phone"><div class="status"><span>9:41</span><span>▮ ))) ▰</span></div><div class="canvas" id="app"></div><nav class="nav" id="nav"></nav></div>
    </section>
  </main>
  <script>
    const packages=[
      {id:'weekly',name:'Weekly Max',data:'10 GB',duration:'7 days',price:15,accent:'#a8ff3e'},
      {id:'social',name:'Social Plus',data:'5 GB',duration:'14 days',price:8,accent:'#70dfff'},
      {id:'monthly',name:'Monthly 25',data:'25 GB',duration:'30 days',price:35,accent:'#bba6ff'}
    ];
    const state={screen:'home',selected:'weekly',rechargeAmount:10,rechargeCode:'1234 5678 9012',transferAmount:5,phone:'092 000 0000',completed:[],lastFlow:'package'};
    const $=s=>document.querySelector(s);const chosen=()=>packages.find(p=>p.id===state.selected);
    const titles={packages:'Internet packages','package-review':'Review purchase',recharge:'Recharge credit','recharge-review':'Review recharge',transfer:'Transfer credit','transfer-review':'Review transfer'};
    function go(screen){state.screen=screen;render()}
    function back(){go({packages:'home','package-review':'packages',recharge:'home','recharge-review':'recharge',transfer:'home','transfer-review':'transfer',success:'home'}[state.screen]||'home')}
    function finish(flow){state.lastFlow=flow;if(!state.completed.includes(flow))state.completed.push(flow);go('success')}
    function setPackage(id){state.selected=id;render()}
    function setAmount(kind,value){state[kind]=value;render()}
    function mask(code){const d=code.replace(/\s/g,'');return d.length>4?'•••• •••• '+d.slice(-4):'•••• •••• ••••'}
    function amountButtons(kind,values){return `<div class="amounts">${values.map(v=>`<button class="${state[kind]===v?'selected':''}" onclick="setAmount('${kind}',${v})"><strong>${v}</strong><span>LYD</span></button>`).join('')}</div>`}
    function subhead(){return `<header class="subhead"><button class="back" onclick="back()" aria-label="Go back">←</button><h2>${titles[state.screen]}</h2><span></span></header>`}
    function home(){return `<div class="screen"><header class="home-head"><div class="brand"><span class="logo">L</span><span>libyana</span></div><div class="avatar">OM</div></header><p class="welcome">Good morning, Omar</p><section class="balance"><div class="balance-top"><span>Main balance</span><span>✓ Secure</span></div><strong>32.40 <small>LYD</small></strong><div class="balance-meta"><span>Valid until 30 Sep 2026</span><button class="pill" onclick="go('recharge')">Recharge</button></div></section><section class="usage"><article><span class="usage-icon">◔</span><div><strong>6.8 GB</strong><span>of 10 GB</span></div><div class="mini"><i style="width:68%"></i></div></article><article><span class="usage-icon blue">◕</span><div><strong>120 min</strong><span>local calls</span></div><div class="mini blue"><i style="width:48%"></i></div></article></section><section><div class="heading"><h2>Quick services</h2><span>Tap to begin</span></div><div class="services">${service('package','Buy package','▣','packages')}${service('recharge','Recharge credit','+','recharge')}${service('transfer','Transfer credit','↗','transfer')}</div></section><button class="offer" onclick="go('packages')"><span class="offer-icon">✦</span><span><small>Recommended for you</small><strong>Weekly Max • 10 GB</strong></span><b>›</b></button></div>`}
    function service(flow,label,icon,target){const done=state.completed.includes(flow);return `<button class="service" onclick="go('${target}')"><span class="service-icon">${done?'✓':icon}</span><span>${label}</span>${done?'<small>Completed</small>':''}</button>`}
    function packagesScreen(){return `${subhead()}<div class="screen flow"><p class="intro">Choose the package that fits your needs.</p><div class="package-list">${packages.map((p,i)=>`<button class="package ${state.selected===p.id?'selected':''}" onclick="setPackage('${p.id}')">${i===0?'<span class="popular">Popular</span>':''}<span class="accent" style="background:${p.accent}"></span><span class="package-info"><strong>${p.name}</strong><small>${p.duration}</small></span><span class="package-data">${p.data}</span><span class="price"><strong>${p.price}</strong><small> LYD</small></span><span class="radio"></span></button>`).join('')}</div><div class="secure">✓ Secure purchase from your main balance</div><button class="action" onclick="go('package-review')">Continue →</button></div>`}
    function recharge(){return `${subhead()}<div class="screen flow"><p class="intro">Enter a voucher code and choose the amount.</p><label class="label" for="voucher">Voucher code</label><input class="input" id="voucher" value="${state.rechargeCode}" oninput="state.rechargeCode=this.value" inputmode="numeric"><span class="help">Demo code is already entered.</span><span class="label amount-label">Recharge amount</span>${amountButtons('rechargeAmount',[10,20,50])}<div class="info"><b>▣</b><span><strong>Recharge your own number</strong><small>092 123 4567</small></span></div><button class="action bottom-push" onclick="go('recharge-review')">Review recharge →</button></div>`}
    function transfer(){return `${subhead()}<div class="screen flow"><p class="intro">Send credit to another Libyana number.</p><label class="label" for="phone">Recipient number</label><input class="input" id="phone" value="${state.phone}" oninput="state.phone=this.value" inputmode="tel"><span class="label amount-label">Transfer amount</span>${amountButtons('transferAmount',[5,10,20])}<div class="available"><span>Available balance</span><strong>32.40 LYD</strong></div><div class="secure">✓ Recipient details can be reviewed next</div><button class="action bottom-push" onclick="go('transfer-review')">Review transfer →</button></div>`}
    function review(flow){let icon,label,title,rows,total,button;if(flow==='package'){const p=chosen();icon='▣';label='Internet package';title=p.name;rows=[['Allowance',p.data],['Duration',p.duration],['Payment','Main balance']];total=`${p.price.toFixed(2)} LYD`;button='Confirm purchase'}else if(flow==='recharge'){icon='+';label='Voucher recharge';title=`${state.rechargeAmount.toFixed(2)} LYD`;rows=[['Mobile number','092 123 4567'],['Recharge code',mask(state.rechargeCode)],['Fee','0.00 LYD']];total=title;button='Confirm recharge'}else{icon='↗';label='Credit transfer';title=`${state.transferAmount.toFixed(2)} LYD`;rows=[['Recipient',state.phone||'092 000 0000'],['Transfer fee','0.20 LYD'],['From','Main balance']];total=`${(state.transferAmount+.2).toFixed(2)} LYD`;button='Confirm transfer'}return `${subhead()}<div class="screen flow"><div class="hero"><span>${icon}</span><small>${label}</small><strong>${title}</strong></div><div class="review">${rows.map(r=>`<div><span>${r[0]}</span><strong>${r[1]}</strong></div>`).join('')}<div class="total"><span>Total</span><strong>${total}</strong></div></div><div class="secure">✓ Review the information before confirming</div><button class="action bottom-push" onclick="finish('${flow}')">${button}</button></div>`}
    function success(){const f=state.lastFlow;const p=chosen();const text=f==='package'?`${p.name} is now active on your line.`:f==='recharge'?`${state.rechargeAmount.toFixed(2)} LYD was added to your balance.`:`${state.transferAmount.toFixed(2)} LYD was sent successfully.`;const detail=f==='package'?`${p.data} • ${p.duration}`:f==='recharge'?'New balance: 42.40 LYD':`Recipient: ${state.phone}`;return `<div class="screen success"><div class="orbit"><span>✓</span></div><div class="success-copy"><span>Transaction complete</span><h2>All done!</h2><p>${text}</p></div><div class="success-detail"><span>${detail}</span><small>A confirmation notification has been sent.</small></div><button class="action" onclick="go('home')">Back to home</button><p class="success-note">✓ Your transaction was processed securely</p></div>`}
    function renderNav(){const active=state.screen;$('#nav').innerHTML=`<button class="${active==='home'||active==='success'?'active':''}" onclick="go('home')"><b>⌂</b><span>Home</span></button><button class="${active.startsWith('package')?'active':''}" onclick="go('packages')"><b>▣</b><span>Packages</span></button><button class="${active.startsWith('transfer')?'active':''}" onclick="go('transfer')"><b>↗</b><span>Transfer</span></button>`}
    function render(){const views={home,packages:packagesScreen,recharge,transfer,'package-review':()=>review('package'),'recharge-review':()=>review('recharge'),'transfer-review':()=>review('transfer'),success};$('#app').innerHTML=views[state.screen]();renderNav();$('#progress-label').textContent=`${state.completed.length}/3 flows completed`;$('#progress-bar').style.width=`${state.completed.length/3*100}%`}
    render();
  </script>
</body>
</html>
